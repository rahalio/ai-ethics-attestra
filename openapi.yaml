openapi: 3.0.3
info:
  title: Attestra
  version: 0.1.0
  description: >-
    AI assurance control plane for European enterprises. Attestra registers every AI
    system and the decision types it feeds, records the lawful basis for solely
    automated decisions, keeps individual-rights safeguards demonstrably live, schedules
    fairness and explainability obligations, enforces independent second-line challenge,
    and issues an expiring deployment clearance that the release pipeline treats as a
    gate. Portfolio state is priced as value at stake across intelligent automation,
    augmentation and innovation diffusion.
  x-product-slug: ai-ethics-attestra
  x-source: ai-in-ethics/Accenture-Realising-Economic-Societal-Potential-Responsible-AI-2/
servers:
  - url: https://api.example.com
tags:
  - name: Inventory
    description: AI systems, the decision types they feed, intended use and risk tiering
  - name: Lawful Basis
    description: Registration and validity of the basis for solely automated decisions
  - name: Testing
    description: Fairness assessments, protected-attribute scope and algorithm audits
  - name: Explainability
    description: Per-use-case determination of explanation obligations and artefacts
  - name: Clearance
    description: Clearance requests, independent challenge, clearances and risk acceptance
  - name: Oversight
    description: Named human overseers, competence and capacity
  - name: Contestation
    description: Human intervention, point-of-view and contestation cases
  - name: Third-Party Models
    description: Vendor model due diligence and re-assessment
  - name: Provenance
    description: Dataset source, rights and text-and-data-mining position
  - name: Conformity
    description: Mapping of internal controls to external codes, standards and schemes
  - name: Incidents
    description: AI incident capture and regulatory notification
  - name: Value at Stake
    description: Priced portfolio reporting by growth channel
paths:
  /v1/ai-systems:
    get:
      operationId: listAiSystems
      tags: [Inventory]
      summary: List registered AI systems
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: riskTier
          in: query
          schema:
            $ref: "#/components/schemas/RiskTier"
        - name: clearanceState
          in: query
          schema:
            $ref: "#/components/schemas/ClearanceState"
        - name: businessUnit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: AI systems page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAiSystem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerAiSystem
      tags: [Inventory]
      summary: Register an AI system in the inventory
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSystemCreate"
      responses:
        "201":
          description: AI system registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAiSystem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/ai-systems/{aiSystemId}:
    parameters:
      - $ref: "#/components/parameters/AiSystemId"
    get:
      operationId: getAiSystem
      tags: [Inventory]
      summary: Get an AI system with its current clearance state
      security:
        - BearerAuth: []
      responses:
        "200":
          description: AI system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAiSystem"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{aiSystemId}/intended-use:
    parameters:
      - $ref: "#/components/parameters/AiSystemId"
    put:
      operationId: declareIntendedUse
      tags: [Inventory]
      summary: Declare or revise the intended-use statement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntendedUseStatement"
      responses:
        "200":
          description: Intended use recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeIntendedUseStatement"
        "409":
          description: Revision materially changes scope and degrades the live clearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/ai-systems/{aiSystemId}/decision-types:
    parameters:
      - $ref: "#/components/parameters/AiSystemId"
    get:
      operationId: listDecisionTypes
      tags: [Inventory]
      summary: List decision types this system contributes to
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Decision types page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDecisionType"
    post:
      operationId: registerDecisionType
      tags: [Inventory]
      summary: Register a decision type served by this system
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionTypeCreate"
      responses:
        "201":
          description: Decision type registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDecisionType"
  /v1/ai-systems/{aiSystemId}/risk-tiering:
    parameters:
      - $ref: "#/components/parameters/AiSystemId"
    post:
      operationId: assessRiskTier
      tags: [Inventory]
      summary: Assess and assign the risk tier
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskTierAssessmentCreate"
      responses:
        "201":
          description: Risk tier assessed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRiskTierAssessment"
  /v1/decision-types/{decisionTypeId}/lawful-basis:
    parameters:
      - $ref: "#/components/parameters/DecisionTypeId"
    get:
      operationId: getLawfulBasis
      tags: [Lawful Basis]
      summary: Get the registered basis for a solely automated decision
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lawful basis registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLawfulBasisRegistration"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: registerAutomatedDecisionBasis
      tags: [Lawful Basis]
      summary: Register the lawful basis for automating this decision
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LawfulBasisRegistrationCreate"
      responses:
        "201":
          description: Lawful basis registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLawfulBasisRegistration"
        "422":
          description: No permitted basis applies and the decision may not be fully automated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/decision-types/{decisionTypeId}/safeguards:
    parameters:
      - $ref: "#/components/parameters/DecisionTypeId"
    put:
      operationId: configureSafeguards
      tags: [Lawful Basis]
      summary: Configure intervention, point-of-view and contestation channels
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafeguardConfiguration"
      responses:
        "200":
          description: Safeguards configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSafeguardConfiguration"
  /v1/ai-systems/{aiSystemId}/fairness-assessments:
    parameters:
      - $ref: "#/components/parameters/AiSystemId"
    get:
      operationId: listFairnessAssessments
      tags: [Testing]
      summary: List fairness assessments for a system
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Fairness assessments page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFairnessAssessment"
    post:
      operationId: recordFairnessAssessment
      tags: [Testing]
      summary: Record a completed fairness assessment and its evidenced scope
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FairnessAssessmentCreate"
      responses:
        "201":
          description: Fairness assessment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFairnessAssessment"
        "422":
          description: Protected attribute claimed without a lawful basis for holding it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/ai-systems/{aiSystemId}/algorithm-audits:
    parameters:
      - $ref: "#/components/parameters/AiSystemId"
    post:
      operationId: commissionAlgorithmAudit
      tags: [Testing]
      summary: Commission an audit that the system performs as intended
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlgorithmAuditCreate"
      responses:
        "201":
          description: Algorithm audit commissioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAlgorithmAudit"
  /v1/decision-types/{decisionTypeId}/explainability-determination:
    parameters:
      - $ref: "#/components/parameters/DecisionTypeId"
    put:
      operationId: determineExplainabilityObligation
      tags: [Explainability]
      summary: Determine whether explanation is required, desirable or unnecessary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainabilityDetermination"
      responses:
        "200":
          description: Explainability determination recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExplainabilityDetermination"
  /v1/clearance-requests:
    get:
      operationId: listClearanceRequests
      tags: [Clearance]
      summary: List clearance requests ordered by risk and expiry
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, in_challenge, blocked, cleared, withdrawn]
      responses:
        "200":
          description: Clearance requests page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeClearanceRequest"
    post:
      operationId: requestDeploymentClearance
      tags: [Clearance]
      summary: Request clearance to deploy or continue operating a system
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearanceRequestCreate"
      responses:
        "201":
          description: Clearance request submitted with outstanding evidence listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeClearanceRequest"
  /v1/clearance-requests/{clearanceRequestId}/challenge-findings:
    parameters:
      - $ref: "#/components/parameters/ClearanceRequestId"
    post:
      operationId: raiseChallengeFinding
      tags: [Clearance]
      summary: Raise a second-line challenge finding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeFindingCreate"
      responses:
        "201":
          description: Challenge finding raised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeChallengeFinding"
        "403":
          description: Reviewer sits inside the owning unit's reporting line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/clearance-requests/{clearanceRequestId}/decision:
    parameters:
      - $ref: "#/components/parameters/ClearanceRequestId"
    post:
      operationId: decideClearanceRequest
      tags: [Clearance]
      summary: Issue, condition or refuse a deployment clearance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearanceDecision"
      responses:
        "201":
          description: Clearance decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeploymentClearance"
        "409":
          description: Blocking findings remain unresolved and unaccepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/ai-systems/{aiSystemId}/clearance:
    parameters:
      - $ref: "#/components/parameters/AiSystemId"
    get:
      operationId: getDeploymentClearance
      tags: [Clearance]
      summary: Get the current clearance for gating a release
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Current clearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeploymentClearance"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/risk-acceptances:
    get:
      operationId: listRiskAcceptances
      tags: [Clearance]
      summary: List live risk acceptances with named owners and expiry
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Risk acceptances page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeRiskAcceptance"
    post:
      operationId: signRiskAcceptance
      tags: [Clearance]
      summary: Accept a known control gap for a bounded period
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskAcceptanceCreate"
      responses:
        "201":
          description: Risk acceptance signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRiskAcceptance"
  /v1/oversight-assignments:
    get:
      operationId: listOversightAssignments
      tags: [Oversight]
      summary: List oversight assignments and concentration warnings
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: overConcentratedOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Oversight assignments page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeOversightAssignment"
    post:
      operationId: assignHumanOversight
      tags: [Oversight]
      summary: Nominate a named human overseer for a decision type
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OversightAssignmentCreate"
      responses:
        "201":
          description: Oversight nomination created pending acceptance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOversightAssignment"
  /v1/oversight-assignments/{assignmentId}/response:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: respondToOversightNomination
      tags: [Oversight]
      summary: Accept or refuse an oversight nomination
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                  enum: [accepted, refused]
                refusalReason:
                  type: string
                  enum: [insufficient_competence, insufficient_capacity, conflict_of_interest]
                competency:
                  $ref: "#/components/schemas/OverseerCompetency"
      responses:
        "200":
          description: Nomination response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOversightAssignment"
  /v1/contestations:
    get:
      operationId: listContestations
      tags: [Contestation]
      summary: List contestation and intervention cases
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: breachedCommitment
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Contestation cases page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeContestationCase"
    post:
      operationId: openContestation
      tags: [Contestation]
      summary: Open a human intervention, point-of-view or contestation case
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestationCaseCreate"
      responses:
        "201":
          description: Case opened with response commitment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeContestationCase"
  /v1/contestations/{contestationId}/decision:
    parameters:
      - $ref: "#/components/parameters/ContestationId"
    post:
      operationId: decideContestation
      tags: [Contestation]
      summary: Record the named overseer's decision on a case
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, rationale, decidedBy]
              properties:
                outcome:
                  type: string
                  enum: [upheld, overturned, partially_amended, referred_out]
                rationale:
                  type: string
                decidedBy:
                  type: string
                  description: Named overseer identifier
      responses:
        "200":
          description: Case decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeContestationCase"
  /v1/third-party-models:
    get:
      operationId: listThirdPartyModels
      tags: [Third-Party Models]
      summary: List vendor-supplied models and their assurance state
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Third-party models page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeThirdPartyModel"
  /v1/third-party-models/{vendorModelId}/due-diligence:
    parameters:
      - $ref: "#/components/parameters/VendorModelId"
    post:
      operationId: recordVendorDueDiligence
      tags: [Third-Party Models]
      summary: Record what was independently verified versus accepted on assurance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorDueDiligenceCreate"
      responses:
        "201":
          description: Due diligence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeVendorDueDiligence"
  /v1/dataset-provenance:
    post:
      operationId: registerDatasetProvenance
      tags: [Provenance]
      summary: Register dataset source, licence and mining rights position
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetProvenanceCreate"
      responses:
        "201":
          description: Provenance registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDatasetProvenance"
  /v1/ai-systems/{aiSystemId}/liability-apportionment:
    parameters:
      - $ref: "#/components/parameters/AiSystemId"
    put:
      operationId: recordLiabilityApportionment
      tags: [Conformity]
      summary: Record responsibility split per operating mode
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiabilityApportionment"
      responses:
        "200":
          description: Apportionment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLiabilityApportionment"
  /v1/conformity-mappings:
    get:
      operationId: listConformityMappings
      tags: [Conformity]
      summary: List control-to-scheme mappings and affected external claims
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: scheme
          in: query
          schema:
            type: string
            example: iso_iec_jtc1_sc42
      responses:
        "200":
          description: Conformity mappings page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeConformityMapping"
  /v1/ai-systems/{aiSystemId}/dossier:
    parameters:
      - $ref: "#/components/parameters/AiSystemId"
    get:
      operationId: getConformityDossier
      tags: [Conformity]
      summary: Issue a scoped dossier extract for an assessor or customer
      security:
        - BearerAuth: []
      parameters:
        - name: audience
          in: query
          required: true
          schema:
            type: string
            enum: [internal_audit, certification_body, supervisory_authority, enterprise_customer, insurer]
        - name: asOf
          in: query
          description: Reconstruct the dossier as it stood on this date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dossier extract with privileged material excluded by audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConformityDossier"
  /v1/incidents:
    post:
      operationId: reportAiIncident
      tags: [Incidents]
      summary: Report an AI incident and track notification obligations
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiIncidentCreate"
      responses:
        "201":
          description: Incident recorded with notification clocks started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAiIncident"
  /v1/value-at-stake:
    get:
      operationId: getValueAtStakeReport
      tags: [Value at Stake]
      summary: Report priced portfolio state by growth channel
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            example: 2026-Q3
        - name: businessUnit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Value at stake by clearance state and growth channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeValueAtStakeReport"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AiSystemId:
      name: aiSystemId
      in: path
      required: true
      schema:
        type: string
    DecisionTypeId:
      name: decisionTypeId
      in: path
      required: true
      schema:
        type: string
    ClearanceRequestId:
      name: clearanceRequestId
      in: path
      required: true
      schema:
        type: string
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
    ContestationId:
      name: contestationId
      in: path
      required: true
      schema:
        type: string
    VendorModelId:
      name: vendorModelId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
